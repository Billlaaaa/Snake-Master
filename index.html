<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFA Command Center</title>

<style>
:root{
  --bg:#000;--bg1:#0d0d0d;--bg2:#121212;--bg3:#1a1a1a;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --text:#f0ede6;--text2:#9a9890;--text3:#555350;
  --gold:#e8a020;--gold2:#f5c842;--green:#00d97e;--red:#ff4d4d;--blue:#2196f3;--purple:#bb86fc;
  --r:8px;--rs:5px;--rl:12px;
  --topbar-h:52px;--bottomnav-h:0px;
}
@media(max-width:700px){:root{--topbar-h:48px;--bottomnav-h:60px}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.008) 3px,rgba(255,255,255,0.008) 4px);pointer-events:none;z-index:9999}

/* ── TOPBAR ── */
#topbar{
  height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;
  background:var(--bg1);border-bottom:1px solid var(--border2);
  padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.8)
}
.brand{font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.tabs-nav{display:flex;gap:2px;height:100%}
.tab-btn{font-family:'Courier New',Courier,monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0 18px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;height:100%}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(232,160,32,.06)}
.topbar-right{display:flex;align-items:center;gap:6px}
.chip{font-family:'Courier New',Courier,monospace;font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);white-space:nowrap}
.chip-gold{color:var(--gold);border-color:rgba(232,160,32,.3);background:rgba(232,160,32,.08)}
.chip-green{color:var(--green);border-color:rgba(0,217,126,.3);background:rgba(0,217,126,.08)}

/* ── BOTTOM NAV (mobile only) ── */
#bottom-nav{display:none}
@media(max-width:700px){
  #bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--bottomnav-h);
    background:var(--bg1);border-top:1px solid var(--border2);z-index:100;
    box-shadow:0 -2px 12px rgba(0,0,0,.6)
  }
  .bn-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:transparent;border:none;cursor:pointer;color:var(--text3);
    font-family:'Courier New',Courier,monospace;font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;padding:8px 0;transition:color .15s;
    -webkit-tap-highlight-color:transparent;min-height:44px
  }
  .bn-btn.active{color:var(--gold)}
  .bn-icon{font-size:18px;line-height:1}
  .tabs-nav{display:none}
  #top-days{display:none}
}

/* ── LAYOUT ── */
#app{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:var(--bottomnav-h);overflow:hidden}
.tab-panel{display:none;height:100%;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;padding-bottom:12px}
@media(max-width:700px){.tab-panel{padding-bottom:72px}}
.tab-panel.active{display:block}
.tab-panel::-webkit-scrollbar{width:4px}
.tab-panel::-webkit-scrollbar-track{background:var(--bg1)}
.tab-panel::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}

/* ── OVERVIEW CARD ── */
.ov-card{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:700;color:var(--gold)}
.ring-lbl{font-family:'Courier New',Courier,monospace;font-size:8px;color:var(--text3)}
.ov-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ov-s{text-align:center}
.ov-val{font-family:'Courier New',Courier,monospace;font-size:16px;font-weight:700}
.ov-lbl{font-family:'Courier New',Courier,monospace;font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
@media(max-width:700px){
  .ov-stats{grid-template-columns:repeat(3,1fr)}
  .ov-val{font-size:18px}
  .ov-lbl{font-size:9px}
}
.gbar{height:3px;background:var(--bg3);border-radius:2px;margin-bottom:10px;overflow:hidden}
.gbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .5s}

/* ── SUBJECT GRID ── */
.subj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
@media(max-width:700px){.subj-grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.scard{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:10px;cursor:pointer;transition:all .15s;border-top:2px solid transparent}
.scard:active{background:var(--bg3)}
.scard-pct{font-family:'Courier New',Courier,monospace;font-size:18px;font-weight:700}
@media(max-width:700px){.scard-pct{font-size:22px}}
.scard-name{font-size:10px;color:var(--text2);margin:2px 0}
@media(max-width:700px){.scard-name{font-size:11px}}
.mini-bar{height:2px;background:var(--bg3);border-radius:1px;margin-top:5px;overflow:hidden}
.mini-fill{height:100%;border-radius:1px;transition:width .5s}
.scard-eta{font-family:'Courier New',Courier,monospace;font-size:9px;color:var(--text3);margin-top:3px}

/* ── TREE ── */
.tree{display:flex;flex-direction:column;gap:5px}
.t-subj{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.t-subj-hdr{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;min-height:48px}
.t-subj-hdr:active{background:var(--bg3)}
.caret{font-size:9px;color:var(--text3);width:10px;transition:transform .2s;flex-shrink:0;display:inline-block}
.caret.open{transform:rotate(90deg)}
.t-subj-name{font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif;font-size:13px;font-weight:700;flex:1;min-width:0}
@media(max-width:700px){.t-subj-name{font-size:14px}}
.t-subj-meta{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text2);white-space:nowrap}
.sbadge{font-family:'Courier New',Courier,monospace;font-size:9px;padding:2px 6px;border-radius:8px;margin-left:4px;white-space:nowrap}
.bd{background:rgba(0,217,126,.12);color:var(--green);border:1px solid rgba(0,217,126,.25)}
.ba{background:rgba(232,160,32,.12);color:var(--gold);border:1px solid rgba(232,160,32,.25)}
.bp{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
@media(max-width:700px){.sbadge{display:none}}
.t-subj-body{display:none}
.t-subj-body.open{display:block}
.t-topic{border-top:1px solid var(--border);background:var(--bg2)}
.t-topic-hdr{display:flex;align-items:center;gap:7px;padding:9px 12px 9px 24px;cursor:pointer;transition:background .15s;min-height:44px}
.t-topic-hdr:active{background:var(--bg3)}
.topic-num{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);width:26px;flex-shrink:0}
.topic-name{flex:1;font-size:12px;min-width:0}
@media(max-width:700px){.topic-name{font-size:13px}}
.topic-meta{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);white-space:nowrap}
.t-topic-body{display:none}
.t-topic-body.open{display:block}
.v-row{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 38px;border-top:1px solid rgba(255,255,255,.025);cursor:default}
.v-row:active{background:rgba(255,255,255,.03)}
@media(max-width:700px){.v-row{padding:10px 12px 10px 38px;min-height:44px}}
.vcb-wrap{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:default;margin-left:-4px}
.vcb{width:15px;height:15px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:all .15s;pointer-events:none}
.vcb.on{background:var(--green);border-color:var(--green)}
.vcb.on::after{content:'✓';font-size:9px;color:#000;font-weight:700}
.vcb.locked{opacity:.35;background:var(--green);border-color:var(--green)}
.vcb.locked::after{content:'✓';font-size:9px;color:#000;font-weight:700}
.vnum{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);width:30px;flex-shrink:0}
.vdur{font-family:'Courier New',Courier,monospace;font-size:9px;padding:2px 5px;border-radius:2px;background:var(--bg3);color:var(--text2);flex-shrink:0}
.vdur.long{background:rgba(255,140,66,.15);color:#ff8c42;border:1px solid rgba(255,140,66,.2)}
.vname{flex:1;font-size:12px;min-width:0}
@media(max-width:700px){.vname{font-size:13px}}
.v-row.done-v .vname{text-decoration:line-through;color:var(--text3)}

/* ── DAILY ── */
.d-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.d-date{font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif;font-size:16px;font-weight:800}
@media(max-width:700px){.d-date{font-size:15px}}
.d-meta{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);margin-top:2px}
.rebuild-btn{font-family:'Courier New',Courier,monospace;font-size:10px;padding:7px 12px;border-radius:6px;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;min-height:36px}
.d-stats{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dchip{font-family:'Courier New',Courier,monospace;font-size:11px;padding:6px 11px;border-radius:5px;background:var(--bg1);border:1px solid var(--border2)}
@media(max-width:700px){.dchip{font-size:12px;padding:7px 12px}}
.sessions{display:flex;flex-direction:column;gap:7px}
.sess-wrap{background:var(--bg1);border-radius:var(--rl);border:1px solid var(--border);overflow:hidden}
.sess-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--border)}
.sess-title{font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif;font-size:12px;font-weight:700}
@media(max-width:700px){.sess-title{font-size:13px}}
.sess-done{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3)}
.blk-card{border-top:1px solid var(--border);transition:background .15s}
.blk-card.blk-current{background:rgba(232,160,32,.04);border-left:2px solid var(--gold)}
.blk-card.blk-done{background:rgba(0,217,126,.02)}
.blk-card.blk-past{background:rgba(255,77,77,.018)}
.blk-hdr{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;user-select:none;min-height:52px}
.blk-hdr:active{background:rgba(255,255,255,.02)}
.bnum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);font-family:'Courier New',Courier,monospace;font-size:11px;font-weight:700}
.bnum.bc{background:rgba(232,160,32,.2);color:var(--gold);border-color:var(--gold)}
.bnum.bd2{background:rgba(0,217,126,.2);color:var(--green);border-color:var(--green)}
.bnum.bp2{background:rgba(255,77,77,.1);color:var(--red);border-color:rgba(255,77,77,.3)}
.btime{font-family:'Courier New',Courier,monospace;font-size:11px;color:var(--text2);min-width:80px;flex-shrink:0}
@media(max-width:700px){.btime{font-size:12px;min-width:75px}}
.bmod{flex:1;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:700px){.bmod{font-size:12px}}
.bprog{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);white-space:nowrap}
.ball-btn{font-family:'Courier New',Courier,monospace;font-size:9px;padding:5px 9px;border-radius:4px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all .15s;white-space:nowrap;min-height:30px}
@media(max-width:700px){.ball-btn{padding:7px 11px;min-height:36px;font-size:10px}}
.now-badge{font-family:'Courier New',Courier,monospace;font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--gold);color:#000;flex-shrink:0}
.blk-body{display:none;padding:0 13px 10px}
.blk-body.open{display:block}
.blk-slbl{font-family:'Courier New',Courier,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:8px 0 6px;display:flex;align-items:center;gap:7px}
.blk-slbl::after{content:'';flex:1;height:1px;background:var(--border)}
.bv-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.025);min-height:44px;padding:4px 0}
@media(max-width:700px){.bv-row{min-height:52px;padding:6px 0}}
.bcb-wrap{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
@media(max-width:700px){.bcb-wrap{width:44px;height:52px}}
.bcb{width:18px;height:18px;border-radius:4px;border:1px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:all .15s;pointer-events:none}
@media(max-width:700px){.bcb{width:22px;height:22px}}
.bcb.on{background:var(--green);border-color:var(--green)}
.bcb.on::after{content:'✓';font-size:11px;color:#000;font-weight:700}
.bv-num{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);width:36px;flex-shrink:0}
@media(max-width:700px){.bv-num{font-size:11px}}
.bv-dur{font-family:'Courier New',Courier,monospace;font-size:9px;padding:2px 6px;border-radius:2px;background:var(--bg3);color:var(--text2);flex-shrink:0}
@media(max-width:700px){.bv-dur{font-size:10px;padding:3px 7px}}
.bv-name{font-size:11px;line-height:1.3}
@media(max-width:700px){.bv-name{font-size:13px}}
.bv-subj{font-size:9px;color:var(--text3)}
@media(max-width:700px){.bv-subj{font-size:10px}}
.bv-row.bv-done .bv-name{text-decoration:line-through;color:var(--text3)}
.tread-row{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-top:5px;background:rgba(255,255,255,.02);border-radius:5px;min-height:44px}
@media(max-width:700px){.tread-row{min-height:52px;padding:8px}}
.tcb-wrap{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
@media(max-width:700px){.tcb-wrap{width:44px;height:52px}}
.tcb{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,217,126,.35);background:rgba(0,217,126,.06);display:flex;align-items:center;justify-content:center;transition:all .15s;pointer-events:none}
@media(max-width:700px){.tcb{width:22px;height:22px}}
.tcb.on{background:var(--green);border-color:var(--green)}
.tcb.on::after{content:'✓';font-size:11px;color:#000;font-weight:700}
.tread-info{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text2);flex:1}
@media(max-width:700px){.tread-info{font-size:11px}}

/* ── PLANNER ── */
.pl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(max-width:700px){.pl-stats{grid-template-columns:repeat(2,1fr)}}
.pl-stat-card{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;text-align:center}
.pl-stat-val{font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:700;line-height:1}
.pl-stat-lbl{font-family:'Courier New',Courier,monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.pday{border-radius:var(--rl);margin-bottom:10px;overflow:hidden;border:1px solid var(--border)}
.pday.pday-today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,160,32,.2),0 4px 20px rgba(232,160,32,.08)}
.pday.pday-past{opacity:.45;filter:grayscale(.3)}
.pday.pday-over{border-color:var(--red);background:rgba(255,77,77,.015)}
.pday-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;user-select:none;min-height:56px;
  background:var(--bg1);transition:background .15s
}
.pday-hdr:active{background:var(--bg3)}
.pday-today .pday-hdr{background:linear-gradient(135deg,rgba(232,160,32,.12) 0%,rgba(232,160,32,.04) 100%)}
.pday-over .pday-hdr{background:linear-gradient(135deg,rgba(255,77,77,.1) 0%,rgba(255,77,77,.03) 100%)}
.pday-datebadge{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  background:var(--bg3);border:1px solid var(--border2)
}
.pday-today .pday-datebadge{background:rgba(232,160,32,.2);border-color:rgba(232,160,32,.4)}
.pday-over .pday-datebadge{background:rgba(255,77,77,.15);border-color:rgba(255,77,77,.3)}
.pday-day{font-family:'Courier New',Courier,monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);line-height:1}
.pday-today .pday-day{color:var(--gold)}
.pday-over .pday-day{color:var(--red)}
.pday-num{font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:700;line-height:1;margin-top:1px}
.pday-today .pday-num{color:var(--gold)}
.pday-info{flex:1;min-width:0}
.pday-name{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.pday-today .pday-name{color:var(--gold)}
.pday-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pmeta-tag{
  font-family:'Courier New',Courier,monospace;font-size:9px;
  padding:2px 7px;border-radius:10px;
  background:var(--bg3);color:var(--text3);border:1px solid var(--border)
}
.pmeta-tag.tag-today{background:rgba(232,160,32,.15);color:var(--gold);border-color:rgba(232,160,32,.3)}
.pmeta-tag.tag-over{background:rgba(255,77,77,.15);color:var(--red);border-color:rgba(255,77,77,.3)}
.pmeta-tag.tag-mins{color:var(--blue);border-color:rgba(33,150,243,.25);background:rgba(33,150,243,.08)}
.pmeta-tag.tag-vids{color:var(--purple);border-color:rgba(187,134,252,.25);background:rgba(187,134,252,.08)}
.pmeta-tag.tag-done{color:var(--green);border-color:rgba(0,217,126,.25);background:rgba(0,217,126,.08)}
.pday-prog-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:7px;overflow:hidden}
.pday-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.pday-caret{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.pday-caret.open{transform:rotate(90deg)}
.pday-body{display:none;border-top:1px solid var(--border)}
.pday-body.open{display:block}
.p-sess{padding:10px 14px 6px}
.p-sess-hdr{
  display:flex;align-items:center;gap:8px;
  font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)
}
.p-sess-hdr.morning{color:var(--blue)}
.p-sess-hdr.afternoon{color:var(--gold)}
.p-sess-hdr.night{color:var(--purple)}
.p-sess-line{flex:1;height:1px}
.morning .p-sess-line{background:linear-gradient(90deg,rgba(33,150,243,.3),transparent)}
.afternoon .p-sess-line{background:linear-gradient(90deg,rgba(232,160,32,.3),transparent)}
.night .p-sess-line{background:linear-gradient(90deg,rgba(187,134,252,.3),transparent)}
.pblk{
  background:var(--bg2);border-radius:8px;margin-bottom:6px;
  overflow:hidden;border:1px solid var(--border)
}
.pblk-hdr{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--bg2);border-bottom:1px solid var(--border)
}
.pblk-num{
  width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:700;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border2)
}
.pblk-time{font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text2);flex:1}
.pblk-mins{
  font-family:'Courier New',Courier,monospace;font-size:9px;
  padding:2px 7px;border-radius:10px;
  background:rgba(33,150,243,.1);color:var(--blue);border:1px solid rgba(33,150,243,.2)
}
.pv-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-top:1px solid rgba(255,255,255,.03)
}
@media(max-width:700px){.pv-row{min-height:44px;padding:9px 12px}}
.pv-row.pv-done{opacity:.35}
.pv-row.pv-done .pv-name{text-decoration:line-through;color:var(--text3)}
.pv-accent{width:3px;height:28px;border-radius:2px;flex-shrink:0}
.pv-num{font-family:'Courier New',Courier,monospace;font-size:9px;color:var(--text3);width:28px;flex-shrink:0}
.pv-dur{
  font-family:'Courier New',Courier,monospace;font-size:9px;
  padding:2px 5px;border-radius:4px;
  background:var(--bg3);color:var(--text2);flex-shrink:0
}
.pv-content{flex:1;min-width:0}
.pv-name{font-size:12px;line-height:1.3;color:var(--text)}
@media(max-width:700px){.pv-name{font-size:13px}}
.pv-subj-pill{
  display:inline-block;font-family:'Courier New',Courier,monospace;
  font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:8px;margin-top:3px
}
.p-tread{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;border-top:1px solid rgba(255,255,255,.03);
  background:rgba(0,217,126,.03)
}
.p-tread-icon{font-size:12px}
.p-tread-text{font-family:'Courier New',Courier,monospace;font-size:9px;color:rgba(0,217,126,.6)}
@media(max-width:700px){.p-tread-text{font-size:10px}}

// ─── STATE ────────────────────────────────────────────────────────────────────
let prog = {}, dayData = {};

// Cache flags
let _master        = null;
let _lockedCache   = null;
let _statsCache    = null;
let _syllabusCache = null;
let _syllabusDirtyFlag = true;
let _plannerCache  = null;
let _plannerDirtyFlag  = true;
let _dirty         = false;
// FIX: _lastDay initialized to null — will be set reliably inside init() after storage loads
let _lastDay       = null;

function vk(sid,tid,vi){ return sid+'__'+tid+'__'+vi; }
function isDone(sid,tid,vi){ return !!prog[vk(sid,tid,vi)]; }
function isLocked(sid,tid){ return DONE_SUBJS.has(sid)||DONE_TOPICS.has(tid); }

// ─── PREMARKS ────────────────────────────────────────────────────────────────
function applyPremarks(){
  S.forEach(s=>{
    if(DONE_SUBJS.has(s.id)){
      s.T.forEach(t=>t.V.forEach((_,vi)=>{ prog[vk(s.id,t.id,vi)]=true; }));
    } else {
      s.T.filter(t=>DONE_TOPICS.has(t.id)).forEach(t=>t.V.forEach((_,vi)=>{ prog[vk(s.id,t.id,vi)]=true; }));
    }
  });
}

// ─── COMPACT ENCODE/DECODE ───────────────────────────────────────────────────
const SUBJ_MAP = {};
const SUBJ_COLOR_MAP = {};

function buildLookupMaps(){
  S.forEach(s=>{ SUBJ_MAP[s.id]=s; SUBJ_COLOR_MAP[s.id]=s.c; });
}

function master(){
  if(_master) return _master;
  _master=[];
  S.forEach(s=>s.T.forEach(t=>t.V.forEach((_,vi)=>_master.push(vk(s.id,t.id,vi)))));
  return _master;
}

function lockedSet(){
  if(_lockedCache) return _lockedCache;
  const locked=new Set();
  S.forEach(s=>{
    if(DONE_SUBJS.has(s.id)){
      s.T.forEach(t=>t.V.forEach((_,vi)=>locked.add(vk(s.id,t.id,vi))));
    } else {
      s.T.filter(t=>DONE_TOPICS.has(t.id)).forEach(t=>t.V.forEach((_,vi)=>locked.add(vk(s.id,t.id,vi))));
    }
  });
  _lockedCache=locked;
  return locked;
}

function encodeProg(){
  const m=master(), lk=lockedSet();
  return m.map((k,i)=>(prog[k]&&!lk.has(k)?i:-1)).filter(i=>i>=0).join(',');
}

function decodeProg(str){
  prog={};
  if(str&&str.length){
    const m=master();
    str.split(',').forEach(s=>{ const i=+s; if(i>=0&&i<m.length) prog[m[i]]=true; });
  }
  applyPremarks();
}

function encodeDay(){
  const out={};
  Object.entries(dayData).forEach(([d,v])=>{
    const entry={};
    if(v.treads&&Object.keys(v.treads).length) entry.t=v.treads;
    if(v.plan&&v.plan.length) entry.p=v.plan;
    if(Object.keys(entry).length) out[d]=entry;
  });
  return JSON.stringify(out);
}

function decodeDay(str){
  dayData={};
  if(!str||str.length<3) return;
  try{
    const p=JSON.parse(str);
    Object.entries(p).forEach(([d,v])=>{
      dayData[d]={treads:v.t||{}, plan:v.p||null};
    });
  }catch(e){}
}

// ─── SYNC DOT ────────────────────────────────────────────────────────────────
function setSyncDot(s){
  const dot=document.getElementById('sync-dot'); if(!dot) return;
  const c={idle:'#444',saving:'#e8a020',synced:'#00d97e',error:'#ff4d4d'};
  dot.style.background=c[s]||'#444';
  dot.title={idle:'—',saving:'Saving…',synced:'Saved ✓',error:'Retry pending'}[s]||s;
}

// ─── AUTOSAVE ────────────────────────────────────────────────────────────────
function markDirty(){
  _dirty=true;
  _statsCache=null;
  _plannerDirtyFlag=true;
  _syllabusDirtyFlag=true;
}

function markPlanDirtyOnly(){
  _dirty=true;
  _plannerDirtyFlag=true;
}

function flushSave(){
  if(!_dirty) return;
  if(!window.storage){ _dirty=false; return; }
  setSyncDot('saving');
  Promise.all([
    window.storage.set(STORE_PROG, encodeProg()),
    window.storage.set(STORE_DAY,  encodeDay())
  ]).then(()=>{
    _dirty=false;
    setSyncDot('synced');
  }).catch(()=>{
    // Silent — will retry at next interval
  });
}

// FIX: startAutosave() now also starts the midnight-check interval,
// so both only begin after storage has loaded and _lastDay is set.
function startAutosave(){
  setInterval(flushSave, 5*60*1000);
  setInterval(checkMidnight, 60*1000);
}

window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

// ─── PLANNER: locked daily plan ──────────────────────────────────────────────
function buildAndLockTodayPlan(){
  const ts=todayStr();
  if(!dayData[ts]) dayData[ts]={treads:{},plan:null};
  if(!dayData[ts].plan){
    const {blocks}=packDay(getPending());
    const keys=[];
    blocks.forEach(b=>b.vids.forEach(v=>{ if(!keys.includes(v.key)) keys.push(v.key); }));
    dayData[ts].plan=keys;
    markPlanDirtyOnly();
  }
}

// FIX: checkMidnight now references _lastDay which is always set before
// startAutosave() (and therefore before the interval begins).
function checkMidnight(){
  const today=todayStr();
  if(today!==_lastDay){
    _lastDay=today;
    buildAndLockTodayPlan();
    flushSave();
    if(curTab===1) renderDaily();
    if(curTab===2) renderPlanner();
  }
}

// ─── TODAY'S SCHEDULE ────────────────────────────────────────────────────────
// FIX: Only ONE definition of getTodaySched — the full version that correctly
// reconstructs today's schedule from the saved plan keys on reload.
function getTodaySched(){
  const ts=todayStr();
  if(!dayData[ts]) dayData[ts]={treads:{},plan:null};
  if(!dayData[ts].treads) dayData[ts].treads={};

  // Return cached in-memory schedule if already built this session
  if(dayData[ts].sched) return dayData[ts].sched;

  // If a saved plan exists (from a previous session today), reconstruct blocks from it.
  // This preserves all videos (done + pending) in today's layout even after reopening.
  if(dayData[ts].plan && dayData[ts].plan.length){
    const keyToVid={};
    S.forEach(s=>s.T.forEach(t=>t.V.forEach((v,vi)=>{
      const k=vk(s.id,t.id,vi);
      keyToVid[k]={key:k,name:v[0],mins:v[1],
        vidNum:t.n+'.'+(vi+1),topicNum:t.n,topicName:t.name,
        subjId:s.id,subjName:s.name,subjColor:s.c};
    })));
    const todayVids=dayData[ts].plan.map(k=>keyToVid[k]).filter(Boolean);
    const {blocks}=packFromList(todayVids);
    dayData[ts].sched=blocks;
    return dayData[ts].sched;
  }

  // First open ever today — build from live pending queue and lock the plan
  const {blocks}=packDay(getPending());
  dayData[ts].sched=blocks;
  const keys=[];
  blocks.forEach(b=>b.vids.forEach(v=>{ if(!keys.includes(v.key)) keys.push(v.key); }));
  dayData[ts].plan=keys;
  markPlanDirtyOnly();
  return dayData[ts].sched;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
// FIX: _lastDay is set inside the storage callback, before startAutosave() is called.
// This guarantees checkMidnight() never sees _lastDay=null on its first tick.
function init(){
  buildLookupMaps();

  document.getElementById('reset-btn').addEventListener('click',()=>{
    if(confirm('Clear all manually ticked videos? Quant, Econ and FSA T27–34 stay locked.')){
      resetProgress();
    }
  });

  document.getElementById('t1').addEventListener('click', e=>{
    if(e.target.id==='rebuild-btn'||e.target.closest('#rebuild-btn')){
      const ts2=todayStr();
      if(dayData[ts2]){ delete dayData[ts2].sched; delete dayData[ts2].plan; }
      _dirty=true; _statsCache=null; _plannerDirtyFlag=true;
      renderDaily(); return;
    }
    handleDailyClick(e);
  });

  if(window.storage){
    Promise.all([
      window.storage.get(STORE_PROG).catch(()=>null),
      window.storage.get(STORE_DAY).catch(()=>null)
    ]).then(([rp,rd])=>{
      decodeProg(rp&&rp.value?rp.value:'');
      decodeDay(rd&&rd.value?rd.value:'');
      buildAndLockTodayPlan();
      // FIX: set _lastDay after data is loaded, before starting intervals
      _lastDay = todayStr();
      setSyncDot('synced');
      updateTopbar();
      renderSyllabus();
      startAutosave(); // starts both autosave + midnight-check intervals
    }).catch(()=>{
      decodeProg('');
      buildAndLockTodayPlan();
      _lastDay = todayStr();
      setSyncDot('synced');
      updateTopbar();
      renderSyllabus();
      startAutosave();
    });
  } else {
    decodeProg('');
    buildAndLockTodayPlan();
    _lastDay = todayStr();
    setSyncDot('synced');
    updateTopbar();
    renderSyllabus();
    startAutosave();
  }
}

init();

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysFrom(a,b){ return Math.ceil((b-a)/864e5); }
function fmtDate(d){ return d.toLocaleDateString('en-IN',{weekday:'short',month:'short',day:'numeric'}); }
function fmtDateFull(d){ return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function dateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtTime(h,m){
  const tot=h*60+m; const hh=Math.floor(tot/60)%24; const mm=tot%60;
  const d=hh>12?hh-12:(hh===0?12:hh); const s=hh>=12?'PM':'AM';
  return d+':'+(mm<10?'0':'')+mm+' '+s;
}

function getStats(){
  if(_statsCache) return _statsCache;
  let total=0,done=0,totalMins=0,doneMins=0,pendMins=0;
  S.forEach(s=>s.T.forEach(t=>t.V.forEach((v,vi)=>{
    total++; totalMins+=v[1];
    if(isDone(s.id,t.id,vi)){ done++; doneMins+=v[1]; }
    else pendMins+=v[1];
  })));
  _statsCache={total,done,totalMins,doneMins,pendMins,
    pct:totalMins?Math.round(doneMins/totalMins*100):0};
  return _statsCache;
}

function getSubjStats(s){
  let total=0,done=0,mins=0,doneMins=0;
  s.T.forEach(t=>t.V.forEach((v,vi)=>{
    total++; mins+=v[1];
    if(isDone(s.id,t.id,vi)){ done++; doneMins+=v[1]; }
  }));
  return {total,done,mins,doneMins,pct:mins?Math.round(doneMins/mins*100):0};
}

function getPending(){
  const res=[];
  S.forEach(s=>s.T.forEach(t=>t.V.forEach((v,vi)=>{
    if(!isDone(s.id,t.id,vi)) res.push({key:vk(s.id,t.id,vi),name:v[0],mins:v[1],
      vidNum:t.n+'.'+(vi+1),topicNum:t.n,topicName:t.name,subjId:s.id,subjName:s.name,subjColor:s.c});
  })));
  return res;
}

// ─── BLOCK PACKERS ───────────────────────────────────────────────────────────
// packFromList: reconstruct blocks from an explicit ordered list of videos (no cap)
function packFromList(vidList){
  const blocks=[]; let qi=0, over2=null;
  for(let b=0; b<12; b++){
    if(qi>=vidList.length && !over2) break;
    const h=BLK_HOURS[b];
    const studyStart=fmtTime(h,0), studyEnd=fmtTime(h,BLOCK_STUDY), treadEnd=fmtTime(h,60);
    const vids=[]; let bMins=0;
    if(over2){ vids.push(over2); bMins+=over2.dispMins; over2=null; }
    while(qi<vidList.length && bMins<BLOCK_STUDY){
      const nx=vidList[qi], rem=BLOCK_STUDY-bMins;
      if(nx.mins>BLOCK_STUDY){
        if(bMins===0){
          vids.push({...nx,dispMins:BLOCK_STUDY,part:1});
          over2={...nx,dispMins:nx.mins-BLOCK_STUDY,part:2};
          bMins+=BLOCK_STUDY; qi++;
        }
        break;
      } else if(nx.mins<=rem){
        vids.push({...nx,dispMins:nx.mins}); bMins+=nx.mins; qi++;
      } else break;
    }
    if(!vids.length) continue;
    const sess=b===11?'night':(b<4?'morning':'day');
    blocks.push({blkNum:b+1,sess,studyStart,studyEnd,treadEnd,
      timeLabel:studyStart+' – '+treadEnd,vids,bMins});
  }
  const used=new Set(); blocks.forEach(b=>b.vids.forEach(v=>used.add(v.key)));
  return {blocks,used};
}

// packDay: pack from live pending queue, respecting DAILY_CAP
function packDay(queue){
  const blocks=[]; let qi=0, over2=null, totalMins=0;
  for(let b=0;b<12;b++){
    if(qi>=queue.length && !over2) break;
    if(totalMins>=DAILY_CAP && !over2) break;
    const h=BLK_HOURS[b];
    const studyStart=fmtTime(h,0), studyEnd=fmtTime(h,BLOCK_STUDY), treadEnd=fmtTime(h,60);
    const vids=[]; let bMins=0;
    if(over2){ vids.push(over2); bMins+=over2.dispMins; totalMins+=over2.dispMins; over2=null; }
    while(qi<queue.length && bMins<BLOCK_STUDY && totalMins<DAILY_CAP){
      const nx=queue[qi], rem=BLOCK_STUDY-bMins;
      if(nx.mins>BLOCK_STUDY){
        if(bMins===0){
          vids.push({...nx,dispMins:BLOCK_STUDY,part:1});
          over2={...nx,dispMins:nx.mins-BLOCK_STUDY,part:2};
          bMins+=BLOCK_STUDY; totalMins+=BLOCK_STUDY; qi++;
        }
        break;
      } else if(nx.mins<=rem){
        vids.push({...nx,dispMins:nx.mins}); bMins+=nx.mins; totalMins+=nx.mins; qi++;
      } else break;
    }
    if(!vids.length) continue;
    const sess=b===11?'night':(b<4?'morning':'day');
    blocks.push({blkNum:b+1,sess,studyStart,studyEnd,treadEnd,timeLabel:studyStart+' – '+treadEnd,vids,bMins});
  }
  const used=new Set(); blocks.forEach(b=>b.vids.forEach(v=>used.add(v.key)));
  return {blocks,used};
}

  const today=new Date();
  const dDl=Math.max(1,daysFrom(today,DEADLINE));
  const dEx=daysFrom(today,EXAM_DATE);
  let acc=0; const etas={};
  S.forEach(s=>{ acc+=s.T.reduce((a,t)=>a+t.V.filter((_,vi)=>!isDone(s.id,t.id,vi)).reduce((b,v)=>b+v[1],0),0); etas[s.id]=addDays(today,Math.ceil(acc/DAILY_CAP)); });

  let h=`
  <div class="ov-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 76 76" width="76" height="76">
        <circle cx="38" cy="38" r="32" fill="none" stroke="#222" stroke-width="8"/>
        <circle cx="38" cy="38" r="32" fill="none" stroke="#e8a020" stroke-width="8"
          stroke-dasharray="${(2*Math.PI*32*gs.pct/100).toFixed(1)} ${(2*Math.PI*32).toFixed(1)}"
          stroke-linecap="round"/>
      </svg>
      <div class="ring-center"><span class="ring-pct">${gs.pct}%</span><span class="ring-lbl">DONE</span></div>
    </div>
    <div class="ov-stats">
      <div class="ov-s"><div class="ov-val" style="color:var(--gold)">${Math.round(gs.doneMins/60*10)/10}<span style="font-size:10px">h</span></div><div class="ov-lbl">Watched</div></div>
      <div class="ov-s"><div class="ov-val" style="color:var(--text2)">${Math.round(gs.pendMins/60*10)/10}<span style="font-size:10px">h</span></div><div class="ov-lbl">Remaining</div></div>
      <div class="ov-s"><div class="ov-val">${gs.done}</div><div class="ov-lbl">Videos Done</div></div>
      <div class="ov-s"><div class="ov-val" style="color:var(--text2)">${gs.total-gs.done}</div><div class="ov-lbl">Videos Left</div></div>
      <div class="ov-s"><div class="ov-val" style="color:var(--blue)">${dDl}</div><div class="ov-lbl">To Jul 15</div></div>
      <div class="ov-s"><div class="ov-val" style="color:var(--red)">${dEx}</div><div class="ov-lbl">To Exam</div></div>
    </div>
  </div>
  <div class="gbar"><div class="gbar-fill" style="width:${gs.pct}%"></div></div>
  <div class="subj-grid">`;

  S.forEach(s=>{
    const ss=getSubjStats(s);
    const eta=ss.pct===100?'✓ done':fmtDate(etas[s.id]);
    h+=`<div class="scard" style="border-top-color:${s.c}" data-scroll-subj="${s.id}">
      <div>${s.e}</div>
      <div class="scard-pct" style="color:${s.c}">${ss.pct}%</div>
      <div class="scard-name">${s.name}</div>
      <div class="mini-bar"><div class="mini-fill" style="width:${ss.pct}%;background:${s.c}"></div></div>
      <div class="scard-eta">${eta}</div></div>`;
  });
  h+=`</div><div class="tree" id="tree">`;

  S.forEach(s=>{
    const ss=getSubjStats(s);
    const bCls=ss.pct===100?'bd':(ss.pct>0?'ba':'bp');
    const bTxt=ss.pct===100?'✓ Done':(ss.pct>0?'⟳ Active':'○ Pending');
    h+=`<div class="t-subj" id="subj-${s.id}">
      <div class="t-subj-hdr" style="border-left-color:${s.c}" data-toggle-subj="${s.id}">
        <span class="caret" id="sc-${s.id}">▶</span>
        <span style="font-size:15px">${s.e}</span>
        <span class="t-subj-name">${s.name}</span>
        <span class="t-subj-meta">${ss.done}/${ss.total} · ${Math.round(ss.mins/60)}h</span>
        <span class="sbadge ${bCls}">${bTxt}</span>
      </div>
      <div class="t-subj-body" id="sb-${s.id}">`;

    s.T.forEach(t=>{
      const locked=isLocked(s.id,t.id);
      const tDone=t.V.filter((_,vi)=>isDone(s.id,t.id,vi)).length;
      const tMins=t.V.reduce((a,v)=>a+v[1],0);
      h+=`<div class="t-topic">
        <div class="t-topic-hdr" data-toggle-topic="${s.id}__${t.id}">
          <span class="caret" id="tc-${s.id}-${t.id}">▶</span>
          <span class="topic-num">${t.n}</span>
          <span class="topic-name">${t.name}</span>
          <span class="topic-meta">${tDone}/${t.V.length} · ${tMins}m</span>
        </div>
        <div class="t-topic-body" id="tb-${s.id}-${t.id}">`;

      t.V.forEach((v,vi)=>{
        const done=isDone(s.id,t.id,vi);
        const key=vk(s.id,t.id,vi);
        const isLong=v[1]>50;
        h+=`<div class="v-row${done?' done-v':''}" id="vr-${key}">
          <div class="vcb-wrap"><div class="vcb${done?' on':''}${locked?' locked':''}" id="vcb-${key}"></div></div>
          <span class="vnum">${t.n}.${vi+1}</span>
          <span class="vdur${isLong?' long':''}">${v[1]}m${isLong?' ⚠':'  '}</span>
          <span class="vname">${v[0]}</span></div>`;
      });

      h+=`</div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  _syllabusCache=h;
  document.getElementById('t0').innerHTML=h;
  _syllabusDirtyFlag=false;
  if(!document.getElementById('t0')._bound){ document.getElementById('t0').addEventListener('click', handleSyllabusClick); document.getElementById('t0')._bound=true; }
}

function handleSyllabusClick(e){
  const scard=e.target.closest('[data-scroll-subj]');
  if(scard){ const id=scard.dataset.scrollSubj; scrollToSubj(id); return; }
  const subjHdr=e.target.closest('[data-toggle-subj]');
  if(subjHdr){ toggleSubj(subjHdr.dataset.toggleSubj); return; }
  const topicHdr=e.target.closest('[data-toggle-topic]');
  if(topicHdr){ const [sid,tid]=topicHdr.dataset.toggleTopic.split('__'); toggleTopic(sid,tid); return; }
}

function toggleSubj(id){
  document.getElementById('sb-'+id)?.classList.toggle('open');
  document.getElementById('sc-'+id)?.classList.toggle('open');
}

function toggleTopic(sid,tid){
  document.getElementById('tb-'+sid+'-'+tid)?.classList.toggle('open');
  document.getElementById('tc-'+sid+'-'+tid)?.classList.toggle('open');
}

function scrollToSubj(id){
  switchTab(0);
  setTimeout(()=>{
    const el=document.getElementById('subj-'+id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); }
    const sb=document.getElementById('sb-'+id);
    if(sb&&!sb.classList.contains('open')){ toggleSubj(id); }
  },50);
}

// ─── TAB 1: DAILY ─────────────────────────────────────────────────────────────
function renderDaily(){
  const ts=todayStr(); const today=new Date();
  const blocks=getTodaySched();
  if(!dayData[ts]) dayData[ts]={};
  if(!dayData[ts].treads) dayData[ts].treads={};
  const {pendMins}=getStats();
  const dDl=Math.max(1,daysFrom(today,DEADLINE));
  const dEx=daysFrom(today,EXAM_DATE);
  const ahead=dDl*DAILY_CAP-pendMins;
  const studMins=blocks.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).reduce((s,v)=>s+(v.dispMins||v.mins),0),0);
  const doneV=blocks.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
  const totalV=blocks.reduce((a,b)=>a+b.vids.length,0);

  let h=`
  <div class="d-hdr">
    <div>
      <div class="d-date" style="font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif">${fmtDateFull(today)}</div>
      <div class="d-meta">${dDl} days to Jul 15 · ${dEx} days to exam</div>
    </div>
    <button class="rebuild-btn" id="rebuild-btn">↺ rebuild today</button>
  </div>
  <div class="d-stats">
    <div class="dchip" id="dc-study" style="color:var(--green)">📖 ${Math.floor(studMins/60)}h ${studMins%60}m studied</div>
    <div class="dchip" id="dc-vids" style="color:var(--gold)">${doneV}/${totalV} videos</div>
    <div class="dchip" id="dc-ahead" style="color:${ahead>=0?'var(--green)':'var(--red)'}">${ahead>=0?'▲ ahead':'▼ behind'} ${Math.abs(Math.round(ahead/DAILY_CAP*10)/10)}d</div>
  </div>
  <div class="sessions" id="sessions-wrap">`;

  const morning=blocks.filter(b=>b.sess==='morning');
  const day=blocks.filter(b=>b.sess==='day');
  const night=blocks.filter(b=>b.sess==='night');
  const hour=new Date().getHours();

  if(morning.length){
    const md=morning.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
    const mt=morning.reduce((a,b)=>a+b.vids.length,0);
    h+=`<div class="sess-wrap" style="border-top:2px solid var(--blue)">
      <div class="sess-hdr"><span class="sess-title" style="color:var(--blue)">🌤 Morning · 8:00 AM – 12:00 PM</span><span class="sess-done" id="sd-morning">${md}/${mt}</span></div>
      ${morning.map(b=>blockCard(b,hour,ts)).join('')}</div>`;
  }
  if(day.length){
    const dd=day.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
    const dt=day.reduce((a,b)=>a+b.vids.length,0);
    h+=`<div class="sess-wrap" style="border-top:2px solid var(--gold)">
      <div class="sess-hdr"><span class="sess-title" style="color:var(--gold)">☀️ Afternoon · 12:00 PM – 7:00 PM</span><span class="sess-done" id="sd-day">${dd}/${dt}</span></div>
      ${day.map(b=>blockCard(b,hour,ts)).join('')}</div>`;
  }
  if(night.length){
    const nb=night[0];
    const nd=nb.vids.filter(v=>prog[v.key]).length;
    h+=`<div class="sess-wrap" style="border-top:2px solid var(--purple)">
      <div class="sess-hdr"><span class="sess-title" style="color:var(--purple)">🌙 Night · 10:00 PM – 11:00 PM</span><span class="sess-done" id="sd-night">${nd}/${nb.vids.length}</span></div>
      ${blockCard(nb,hour,ts)}</div>`;
  }
  h+=`</div>`;
  document.getElementById('t1').innerHTML=h;

  const curBlk=blocks.find(b=>{ const h2=BLK_HOURS[b.blkNum-1]; return hour>=h2&&hour<h2+1; });
  if(curBlk){ const bb=document.getElementById('bb-'+curBlk.blkNum); if(bb) bb.classList.add('open'); }
}

function blockCard(blk,hour,ts){
  const h2=BLK_HOURS[blk.blkNum-1];
  const isCur=hour>=h2&&hour<h2+1;
  const isPast=hour>=h2+1;
  const allDone=blk.vids.every(v=>prog[v.key]);
  const doneC=blk.vids.filter(v=>prog[v.key]).length;
  const treadOn=dayData[ts]?.treads?.[blk.blkNum]||false;
  const numCls=isCur?'bc':(allDone?'bd2':(isPast?'bp2':''));
  const cardCls=isCur?'blk-current':(allDone?'blk-done':(isPast?'blk-past':''));
  const firstV=blk.vids[0];
  return `<div class="blk-card ${cardCls}" id="blk-${blk.blkNum}">
    <div class="blk-hdr" data-toggle-blk="${blk.blkNum}">
      <div class="bnum ${numCls}">${blk.blkNum}</div>
      <div class="btime">${blk.timeLabel}</div>
      ${isCur?'<span class="now-badge">NOW</span>':''}
      <div class="bmod">${firstV?firstV.topicNum+'. '+firstV.topicName:''}</div>
      <div class="bprog" id="bprog-${blk.blkNum}">${doneC}/${blk.vids.length}</div>
      <button class="ball-btn" data-markblk="${blk.blkNum}">✓ all</button>
    </div>
    <div class="blk-body" id="bb-${blk.blkNum}">
      <div class="blk-slbl">📖 Study · ${blk.studyStart} – ${blk.studyEnd}</div>
      ${blk.vids.map(v=>{
        const done=!!prog[v.key];
        const pl=v.part?' Part '+v.part:'';
        return `<div class="bv-row${done?' bv-done':''}" id="bvr-${v.key}">
          <div class="bcb-wrap" data-bvid="${v.key}" data-blk="${blk.blkNum}"><div class="bcb${done?' on':''}" id="bcb-${v.key}"></div></div>
          <span class="bv-num">${v.vidNum}${pl}</span>
          <span class="bv-dur">${v.dispMins}m</span>
          <div><div class="bv-name" id="bvn-${v.key}">${done?'<s style="color:var(--text3)">'+v.name+'</s>':v.name}</div>
          <div class="bv-subj" style="color:${v.subjColor}">${v.subjName}</div></div>
        </div>`;
      }).join('')}
      <div class="tread-row">
        <div class="tcb-wrap" data-tread="${blk.blkNum}"><div class="tcb${treadOn?' on':''}" id="tcb-${blk.blkNum}"></div></div>
        <span>🏃</span>
        <span class="tread-info">Treadmill · ${blk.studyEnd} – ${blk.treadEnd} · 10 min · ${TREAD_SPD} km/hr</span>
      </div>
    </div>
  </div>`;
}

function handleDailyClick(e){
  const blkHdr=e.target.closest('[data-toggle-blk]');
  if(blkHdr&&!e.target.closest('[data-markblk]')&&!e.target.closest('[data-bvid]')&&!e.target.closest('[data-tread]')){
    const n=+blkHdr.dataset.toggleBlk;
    document.getElementById('bb-'+n)?.classList.toggle('open'); return;
  }
  const markBtn=e.target.closest('[data-markblk]');
  if(markBtn){ doMarkBlock(+markBtn.dataset.markblk); return; }
  const vcb=e.target.closest('[data-bvid]');
  if(vcb){ doToggleBvid(vcb.dataset.bvid,+vcb.dataset.blk); return; }
  const tcb=e.target.closest('[data-tread]');
  if(tcb){ doToggleTread(+tcb.dataset.tread); return; }
}

function doToggleBvid(key,blkNum){
  if(prog[key]) delete prog[key]; else prog[key]=true;
  const done=!!prog[key];
  const cb=document.getElementById('bcb-'+key);
  const row=document.getElementById('bvr-'+key);
  const nm=document.getElementById('bvn-'+key);
  if(cb) cb.classList.toggle('on',done);
  if(row) row.classList.toggle('bv-done',done);
  if(nm){ const raw=nm.textContent; nm.innerHTML=done?'<s style="color:var(--text3)">'+raw+'</s>':raw; }
  // Patch syllabus checkboxes in-place (no full re-render needed)
  const svcb=document.getElementById('vcb-'+key);
  if(svcb) svcb.classList.toggle('on',done);
  const svrow=document.getElementById('vr-'+key);
  if(svrow) svrow.classList.toggle('done-v',done);
  updateDailyChips();
  // FIX: invalidate caches and save immediately on every tick
  _dirty=true; _statsCache=null; _plannerDirtyFlag=true;
  updateTopbar();
  flushSave();
}

function doMarkBlock(blkNum){
  const sched=getTodaySched(); const blk=sched.find(b=>b.blkNum===blkNum); if(!blk) return;
  blk.vids.forEach(v=>{ prog[v.key]=true;
    const cb=document.getElementById('bcb-'+v.key); const row=document.getElementById('bvr-'+v.key);
    const nm=document.getElementById('bvn-'+v.key);
    if(cb) cb.classList.add('on'); if(row) row.classList.add('bv-done');
    if(nm) nm.innerHTML='<s style="color:var(--text3)">'+nm.textContent+'</s>';
    const svcb=document.getElementById('vcb-'+v.key);
    if(svcb) svcb.classList.add('on');
    const svrow=document.getElementById('vr-'+v.key);
    if(svrow) svrow.classList.add('done-v');
  });
  updateDailyChips();
  // FIX: save immediately after mark-all
  _dirty=true; _statsCache=null; _plannerDirtyFlag=true;
  updateTopbar();
  flushSave();
}

function doToggleTread(blkNum){
  const ts=todayStr(); if(!dayData[ts]) dayData[ts]={}; if(!dayData[ts].treads) dayData[ts].treads={};
  dayData[ts].treads[blkNum]=!dayData[ts].treads[blkNum];
  const on=dayData[ts].treads[blkNum];
  document.getElementById('tcb-'+blkNum)?.classList.toggle('on',on);
  markDirty();
  flushSave();
}

function updateDailyChips(){
  const blocks=getTodaySched();
  const studMins=blocks.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).reduce((s,v)=>s+(v.dispMins||v.mins),0),0);
  const doneV=blocks.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
  const totalV=blocks.reduce((a,b)=>a+b.vids.length,0);
  const {pendMins}=getStats();
  const dDl=Math.max(1,daysFrom(new Date(),DEADLINE));
  const ahead=dDl*DAILY_CAP-pendMins;
  const chipStudy=document.getElementById('dc-study');
  const chipVids=document.getElementById('dc-vids');
  const chipAhead=document.getElementById('dc-ahead');
  if(chipStudy) chipStudy.textContent='📖 '+Math.floor(studMins/60)+'h '+(studMins%60)+'m studied';
  if(chipVids)  chipVids.textContent=doneV+'/'+totalV+' videos';
  if(chipAhead){ chipAhead.textContent=(ahead>=0?'▲ ahead':'▼ behind')+' '+Math.abs(Math.round(ahead/DAILY_CAP*10)/10)+'d'; chipAhead.style.color=ahead>=0?'var(--green)':'var(--red)'; }
  blocks.forEach(b=>{
    const el=document.getElementById('bprog-'+b.blkNum);
    if(el) el.textContent=b.vids.filter(v=>prog[v.key]).length+'/'+b.vids.length;
  });
  const morning=blocks.filter(b=>b.sess==='morning');
  const day=blocks.filter(b=>b.sess==='day');
  const night=blocks.filter(b=>b.sess==='night');
  const sdMorning=document.getElementById('sd-morning');
  const sdDay=document.getElementById('sd-day');
  const sdNight=document.getElementById('sd-night');
  if(sdMorning){
    const md=morning.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
    const mt=morning.reduce((a,b)=>a+b.vids.length,0);
    sdMorning.textContent=md+'/'+mt;
  }
  if(sdDay){
    const dd=day.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
    const dt=day.reduce((a,b)=>a+b.vids.length,0);
    sdDay.textContent=dd+'/'+dt;
  }
  if(sdNight&&night.length){
    const nd=night[0].vids.filter(v=>prog[v.key]).length;
    sdNight.textContent=nd+'/'+night[0].vids.length;
  }
}

// ─── TAB 2: PLANNER ───────────────────────────────────────────────────────────
function renderPlanner(){
  if(!_plannerDirtyFlag && _plannerCache){
    document.getElementById('t2').innerHTML=_plannerCache;
    if(!document.getElementById('t2')._bound){
      document.getElementById('t2').addEventListener('click',e=>{
        const hdr=e.target.closest('[data-toggle-pday]'); if(!hdr) return;
        const i=+hdr.dataset.togglePday;
        document.getElementById('pdb-'+i)?.classList.toggle('open');
        document.getElementById('pdc-'+i)?.classList.toggle('open');
      });
      document.getElementById('t2')._bound=true;
    }
    return;
  }
  _plannerDirtyFlag=false;
  const {pendMins,total,done}=getStats();
  const today=new Date();
  const dDl=Math.max(1,daysFrom(today,DEADLINE));
  const dNeed=Math.ceil(pendMins/DAILY_CAP);
  const ahead=dDl-dNeed;

  let h=`
  <div class="pl-hdr">
    <span style="font-family:'Arial Black','Helvetica Neue',system-ui,sans-serif;font-size:17px;font-weight:800">📅 Planner</span>
    <span style="font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3)">Locks at midnight · Jul 15 deadline</span>
  </div>
  <div class="pl-stats">
    <div class="pl-stat-card"><div class="pl-stat-val" style="color:var(--text2)">${total-done}</div><div class="pl-stat-lbl">Videos Left</div></div>
    <div class="pl-stat-card"><div class="pl-stat-val" style="color:var(--blue)">${dDl}</div><div class="pl-stat-lbl">Days to Jul 15</div></div>
    <div class="pl-stat-card"><div class="pl-stat-val" style="color:var(--gold)">${dNeed}</div><div class="pl-stat-lbl">Days Needed</div></div>
    <div class="pl-stat-card"><div class="pl-stat-val" style="color:${ahead>=0?'var(--green)':'var(--red)'}">${ahead>=0?'+':''}${ahead}</div><div class="pl-stat-lbl">${ahead>=0?'Days Ahead':'Days Behind'}</div></div>
  </div>`;

  let queue=getPending();
  const todayDate=new Date(); todayDate.setHours(0,0,0,0);
  const startDate=new Date(START_DATE); startDate.setHours(0,0,0,0);
  let d=new Date(Math.max(startDate,todayDate));
  let dayIdx=0;
  const ts=todayStr();

  while((queue.length>0 || dayIdx===0) && dayIdx<60){
    const ds=dateStr(d);
    const isToday=ds===ts;
    const isPast=ds<ts;
    const isOver=ds>dateStr(DEADLINE);

    let blocks;
    if(isToday){
      blocks = getTodaySched();
    } else {
      const packed=packDay(queue);
      blocks=packed.blocks;
      queue=queue.filter(v=>!packed.used.has(v.key));
    }

    if(blocks.length===0 && !isToday){ d=addDays(d,1); dayIdx++; continue; }

    const totalM=blocks.reduce((a,b)=>a+b.bMins,0);
    const vCount=blocks.reduce((a,b)=>a+b.vids.length,0);
    const doneCount=blocks.reduce((a,b)=>a+b.vids.filter(v=>prog[v.key]).length,0);
    const donePct=vCount>0?Math.round(doneCount/vCount*100):0;
    const subjsToday=new Set(blocks.flatMap(b=>b.vids.map(v=>v.subjId)));
    const subjDots=[...subjsToday].slice(0,5).map(sid=>{
      const s=S.find(x=>x.id===sid); return s?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.c}"></span>`:'';
    }).join('');
    const dayCls=isToday?'pday-today':(isOver?'pday-over':(isPast?'pday-past':''));
    const dayName=d.toLocaleDateString('en-IN',{weekday:'short'}).toUpperCase();
    const dayNum=d.getDate();
    const monthName=d.toLocaleDateString('en-IN',{month:'short'}).toUpperCase();

    h+=`<div class="pday ${dayCls}">
      <div class="pday-hdr" data-toggle-pday="${dayIdx}">
        <div class="pday-datebadge">
          <div class="pday-day">${dayName}</div>
          <div class="pday-num">${dayNum}</div>
        </div>
        <div class="pday-info">
          <div class="pday-name">${monthName} ${dayNum}${isToday?' · Today':''}</div>
          <div class="pday-meta">
            ${isToday?'<span class="pmeta-tag tag-today">TODAY</span>':''}
            ${isOver?'<span class="pmeta-tag tag-over">POST DEADLINE</span>':''}
            <span class="pmeta-tag tag-mins">⏱ ${totalM}m</span>
            <span class="pmeta-tag tag-vids">📹 ${vCount} videos</span>
            ${isToday&&doneCount>0?`<span class="pmeta-tag tag-done">✓ ${doneCount}/${vCount} done</span>`:''}
            ${subjDots}
          </div>
          ${isToday?`<div class="pday-prog-bar"><div class="pday-prog-fill" style="width:${donePct}%"></div></div>`:''}
        </div>
        <span class="pday-caret${isToday?' open':''}" id="pdc-${dayIdx}">▶</span>
      </div>
      <div class="pday-body${isToday?' open':''}" id="pdb-${dayIdx}">`;

    const morning=blocks.filter(b=>b.sess==='morning');
    const day2=blocks.filter(b=>b.sess==='day');
    const night=blocks.filter(b=>b.sess==='night');
    if(morning.length) h+=`<div class="p-sess"><div class="p-sess-hdr morning">🌤 Morning<span class="p-sess-line"></span>${morning.length} blocks</div>${morning.map(b=>planBlock(b)).join('')}</div>`;
    if(day2.length)    h+=`<div class="p-sess"><div class="p-sess-hdr afternoon">☀️ Afternoon<span class="p-sess-line"></span>${day2.length} blocks</div>${day2.map(b=>planBlock(b)).join('')}</div>`;
    if(night.length)   h+=`<div class="p-sess"><div class="p-sess-hdr night">🌙 Night<span class="p-sess-line"></span>1 block</div>${night.map(b=>planBlock(b)).join('')}</div>`;

    h+=`</div></div>`;
    d=addDays(d,1); dayIdx++;
    if(dayIdx>1 && queue.length===0) break;
  }

  if(queue.length===0){
    h+=`<div style="text-align:center;padding:30px 20px">
      <div style="font-size:32px;margin-bottom:8px">🎯</div>
      <div style="font-family:'Arial Black','Helvetica Neue',system-ui;font-size:15px;font-weight:800;color:var(--green)">All videos assigned!</div>
      <div style="font-family:'Courier New',Courier,monospace;font-size:10px;color:var(--text3);margin-top:4px">${dayIdx>0?dayIdx+' days · done by '+fmtDate(addDays(new Date(),dayIdx)):'Syllabus complete — time for mocks!'}</div>
    </div>`;
  }

  _plannerCache=h;
  document.getElementById('t2').innerHTML=h;
  if(!document.getElementById('t2')._bound){
    document.getElementById('t2').addEventListener('click',e=>{
      const hdr=e.target.closest('[data-toggle-pday]');
      if(!hdr) return;
      const i=+hdr.dataset.togglePday;
      document.getElementById('pdb-'+i)?.classList.toggle('open');
      document.getElementById('pdc-'+i)?.classList.toggle('open');
    });
    document.getElementById('t2')._bound=true;
  }
}

function planBlock(blk){
  const isMorn=blk.sess==='morning', isNight=blk.sess==='night';
  const sessC=isMorn?'var(--blue)':(isNight?'var(--purple)':'var(--gold)');
  const sessBg=isMorn?'rgba(33,150,243,.15)':(isNight?'rgba(187,134,252,.15)':'rgba(232,160,32,.15)');
  let h=`<div class="pblk">
    <div class="pblk-hdr">
      <div class="pblk-num" style="background:${sessBg};color:${sessC};border-color:${sessC}55">${blk.blkNum}</div>
      <span class="pblk-time">${blk.studyStart} – ${blk.treadEnd}</span>
      <span class="pblk-mins">${blk.bMins}m</span>
    </div>`;
  blk.vids.forEach(v=>{
    const done=!!prog[v.key];
    const pl=v.part?' Pt.'+v.part:'';
    const sc=SUBJ_COLOR_MAP[v.subjId]||'#555';
    h+=`<div class="pv-row${done?' pv-done':''}">
      <div class="pv-accent" style="background:${sc}"></div>
      <span class="pv-num">${v.vidNum}${pl}</span>
      <span class="pv-dur">${v.dispMins}m</span>
      <div class="pv-content">
        <div class="pv-name">${v.name}</div>
        <span class="pv-subj-pill" style="background:${sc}22;color:${sc}">${v.subjName}</span>
      </div>
    </div>`;
  });
  h+=`<div class="p-tread"><span class="p-tread-icon">🏃</span><span class="p-tread-text">Treadmill · ${blk.studyEnd} – ${blk.treadEnd} · 10 min · 4.5 km/hr</span></div></div>`;
  return h;
}
// ─── END ──────────────────────────────────────────────────────────────────────
</script>
</body>
